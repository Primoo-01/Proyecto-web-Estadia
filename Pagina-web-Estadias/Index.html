<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MPCC - Iniciar Sesión</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <main class="login-container">
        
        <section class="logo-section">
            <img src = "mpcc-logo-mj.png" alt = "logo MPCC"
            class="big-logo">
        </section>

        <section class="form-section">
            <div class="login-card">
                <div class="avatar-icon">
                    <svg viewBox="0 0 24 24" width="48" height="48">
                        <path fill="#333" d="M12 12c2.21 0 4-1.79 4-4s-1.79-4-4-4-4 1.79-4 4 1.79 4 4 4zm0 2c-2.67 0-8 1.34-8 4v2h16v-2c0-2.66-5.33-4-8-4z"/>
                    </svg>
                </div>
                <h2>Bienvenidos</h2>
                
                <form id="login-form" autocomplete = "new-password">
                    <div class="input-group">
                        <label for="username">Usuario:</label>
                        <input type="text" id="username" name="username" required>
                    </div>

                    <div class="input-group">
                        <label for="password">Contraseña:</label>
                        <input type="password" id="password" name="password" required>
                    </div>

                    <button type="submit" class="btn-login">Login</button>
                </form>

                <div class="form-links">
                    <a href="#">¿Olvidaste tu contraseña?</a>
                    <a href="#">¿No tienes una cuenta? Regístrate.</a>
                </div>
            </div>
        </section>
    </main>
</body>
</html>
